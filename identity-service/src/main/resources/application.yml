server:
  port: 8081

spring:
  application:
    name: identity-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/identity_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  # Base64-encoded secret, >= 256 bit (bắt buộc với HS256)
  secret: ${JWT_SECRET:dGhpcy1pcy1hLXZlcnktc2VjcmV0LWtleS1mb3ItaWRlbnRpdHktc2VydmljZS1oczI1Ng==}
  access-token-expiration-ms: 900000        # 15 phút
  refresh-token-expiration-ms: 604800000    # 7 ngày
